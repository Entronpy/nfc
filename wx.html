<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>联系作者 · 微信</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #eef1f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 26px 14px; }
  .box { background: #fff; border-radius: 16px; padding: 30px 26px 24px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 6px 24px rgba(20,30,50,.1); }
  h1 { font-size: 19px; margin-bottom: 4px; }
  .sub { color: #67707c; font-size: 12.5px; margin-bottom: 18px; }
  .wximg { width: 100%; max-width: 380px; border-radius: 12px; border: 1px solid #e3e8ef; display: block; margin: 0 auto; }
  .say { margin-top: 20px; font-size: 16px; font-weight: 700; color: #232a33; }
  .tip { font-size: 12px; color: #8a94a0; margin-top: 12px; line-height: 1.8; }
  .back { display: block; margin-top: 18px; font-size: 13px; color: #2563eb; text-decoration: none; }
</style>
</head>
<body>
<div class="box">
  <h1>有问题？加我微信</h1>
  <div class="sub">扫码添加，直接找作者本人</div>
  <img class="wximg" src="wx-qr.jpg" alt="作者微信二维码">
  <div class="say">有问题请加我微信，我是作者。</div>
  <div class="tip">长按或截图后微信扫一扫即可添加。<br>反馈问题、定制需求、批量制卡，都欢迎来聊。</div>
  <a class="back" href="index.html">← 返回制作页</a>
</div>
</body>
</html>
