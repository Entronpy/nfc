<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>本页二维码与链接</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef1f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 26px 14px; }
  .box { background: #fff; border-radius: 16px; padding: 30px 26px 24px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 6px 24px rgba(20,30,50,.1); }
  h1 { font-size: 19px; margin-bottom: 4px; }
  .sub { color: #67707c; font-size: 12.5px; margin-bottom: 20px; }
  .qr { display: flex; justify-content: center; }
  .qr svg { width: 240px; height: 240px; border: 1px solid #e3e8ef; border-radius: 12px; background: #fff; }
  .url { margin-top: 16px; font-family: Consolas, monospace; font-size: 14px; word-break: break-all; background: #f6f8fb; border: 1px solid #e3e8ef; border-radius: 10px; padding: 10px 12px; color: #1d4ed8; }
  .tip { font-size: 12px; color: #8a94a0; margin-top: 14px; line-height: 1.8; }
  .btn { margin-top: 16px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; padding: 10px 22px; cursor: pointer; }
  .back { display: block; margin-top: 18px; font-size: 13px; color: #2563eb; text-decoration: none; }
</style>
</head>
<body>
<div class="box">
  <h1>本页二维码与链接</h1>
  <div class="sub">手机扫码或点击链接，直达卡片内容定制页</div>
  <div class="qr" id="qr"></div>
  <div class="url" id="url"></div>
  <button class="btn" id="copy">📋 复制链接</button>
  <div class="tip">印刷建议：成品不小于 2×2 厘米。<br>这条链接长期有效，可直接写入 NFC 卡片。</div>
  <a class="back" href="index.html">← 返回制作页</a>
</div>
<script src="qrcode.min.js"></script>
<script>
(function () {
  'use strict';
  var CANON = 'https://entronpy.github.io/nfc/';
  document.getElementById('url').textContent = CANON;
  var box = document.getElementById('qr');
  try {
    var q = qrcode(0, 'M');
    q.addData(CANON); q.make();
    box.innerHTML = q.createSvgTag({ cellSize: 6, margin: 2 });
  } catch (e) { box.textContent = '二维码生成失败'; }
  document.getElementById('copy').onclick = function () {
    function fb() {
      var ta = document.createElement('textarea');
      ta.value = CANON; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(CANON).then(function () { ok(); }, fb);
    } else { fb(); }
    function ok() {
      var b = document.getElementById('copy');
      b.textContent = '✅ 已复制';
      setTimeout(function () { b.textContent = '📋 复制链接'; }, 1500);
    }
  };
})();
</script>
</body>
</html>
