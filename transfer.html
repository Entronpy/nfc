<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>转接页 · 已生成的链接与二维码</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #eef1f5; color: #232a33; min-height: 100vh; padding: 26px 14px 60px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 20px; text-align: center; }
  .sub { text-align: center; color: #67707c; font-size: 12.5px; margin: 6px 0 20px; }
  .bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
  .bar button { border: 1px solid #d5dbe3; background: #fff; border-radius: 9px; padding: 6px 12px; font-size: 12.5px; color: #8892a0; cursor: pointer; }
  .bar button:hover { color: #c2233f; border-color: #c2233f; }
  .item { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 10px rgba(20,30,50,.07); margin-bottom: 14px; }
  .item .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .item .label { font-weight: 700; font-size: 14.5px; }
  .item .time { font-size: 11.5px; color: #8a94a0; }
  .item .del { border: none; background: none; color: #c2233f; font-size: 12px; cursor: pointer; }
  .item .url { font-family: Consolas, monospace; font-size: 13px; word-break: break-all; background: #f6f8fb; border-radius: 8px; padding: 8px 10px; margin: 10px 0; color: #14532d; }
  .item .ops { display: flex; gap: 8px; align-items: center; }
  .item .ops a, .item .ops button { font-size: 12.5px; border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; border: 1px solid #d5dbe3; background: #fff; color: #2563eb; }
  .item .ops .primary { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
  .qr { display: none; margin-top: 12px; text-align: center; }
  .qr svg { width: 190px; height: 190px; border: 1px solid #e3e8ef; border-radius: 10px; background: #fff; }
  .empty { text-align: center; color: #8892a0; background: #fff; border-radius: 14px; padding: 46px 20px; font-size: 14px; }
  .empty b { color: #334; }
  .back { display: block; text-align: center; margin: 20px auto 0; font-size: 13px; color: #2563eb; }
  .toast { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); background: rgba(20,28,40,.92); color: #fff; font-size: 14px; border-radius: 10px; padding: 10px 18px; opacity: 0; pointer-events: none; transition: all .25s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>转接页 · 已生成的链接与二维码</h1>
  <div class="sub">自动记录本机生成的最近 200 条链接 · 数据仅存在本机浏览器，不上传<br>列表里的记录可以删，但<b>链接本身不会失效</b>——只要链接文本还在某处（聊天记录/照片/备份文件），打开就还是原来的内容</div>
  <div class="bar"><button id="export">导出备份</button><button id="clear">清空全部</button></div>
  <div id="list"></div>
  <a class="back" href="index.html">← 返回制作页</a>
</div>
<div class="toast" id="toast"></div>
<script src="qrcode.min.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'nfc-transfer';
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function getList() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
  }
  function saveList(l) { localStorage.setItem(KEY, JSON.stringify(l)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(t) {
    var d = new Date(t);
    function p(x) { return (x < 10 ? '0' : '') + x; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function render() {
    var list = getList(), box = document.getElementById('list');
    box.innerHTML = '';
    if (!list.length) {
      box.innerHTML = '<div class="empty">还没有记录。<br><b>去制作页生成一条链接</b>，它会自动出现在这里。</div>';
      return;
    }
    list.forEach(function (it, i) {
      var d = document.createElement('div');
      d.className = 'item';
      d.innerHTML =
        '<div class="head"><div><div class="label">' + esc(it.label) + '</div>' +
        '<div class="time">' + fmt(it.t) + '</div></div>' +
        '<button class="del" data-i="' + i + '">删除</button></div>' +
        '<div class="url">' + esc(it.url) + '</div>' +
        '<div class="ops">' +
        '<button class="primary copy" data-u="' + esc(it.url) + '">📋 复制链接</button>' +
        '<button class="qrbtn" data-i="' + i + '">🔲 二维码</button>' +
        '<a class="open" href="' + esc(it.url) + '" target="_blank" rel="noopener">打开预览 ↗</a>' +
        '</div><div class="qr" id="qr-' + i + '"></div>';
      box.appendChild(d);
    });
    box.querySelectorAll('.del').forEach(function (b) {
      b.onclick = function () {
        var l = getList(); l.splice(Number(b.dataset.i), 1);
        saveList(l); render(); toast('已删除');
      };
    });
    box.querySelectorAll('.copy').forEach(function (b) {
      b.onclick = function () {
        var u = b.dataset.u;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(u).then(function () { toast('已复制'); }, function () { toast('复制失败'); });
        } else toast('复制失败，请手动选择复制');
      };
    });
    box.querySelectorAll('.qrbtn').forEach(function (b) {
      b.onclick = function () {
        var i = Number(b.dataset.i), box2 = document.getElementById('qr-' + i);
        if (box2.style.display === 'block') { box2.style.display = 'none'; return; }
        box2.innerHTML = '';
        try {
          var q = qrcode(0, 'M');
          q.addData(getList()[i].url); q.make();
          box2.innerHTML = q.createSvgTag({ cellSize: 5, margin: 2 });
          box2.style.display = 'block';
        } catch (e) { toast('二维码生成失败'); }
      };
    });
  }
  document.getElementById('export').onclick = function () {
    var list = getList();
    if (!list.length) { toast('没有可导出的记录'); return; }
    var BR = String.fromCharCode(10);
    var lines = [];
    lines.push('# NFC 链接备份（导出于 ' + fmt(Date.now()) + '）');
    lines.push('# 说明：这些链接永久有效；写进卡的链接即使被覆盖，只要这条文本还在，打开仍是原内容。');
    lines.push('');
    list.forEach(function (it) {
      lines.push('【' + it.label + '】 ' + fmt(it.t));
      lines.push(it.url);
      lines.push('');
    });
    var blob = new Blob([lines.join(BR)], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nfc-links-backup-' + new Date().toISOString().slice(0, 10) + '.txt';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('已导出 ' + list.length + ' 条');
  };
  document.getElementById('clear').onclick = function () {
    if (!getList().length) { toast('没有可清空的记录'); return; }
    saveList([]); render(); toast('已清空');
  };
  render();
})();
</script>
</body>
</html>
