<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>碰一碰 · NFC 卡片内容定制</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #eef1f5; color: #222; line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 24px 16px 60px; }
  .page-head { text-align: center; margin: 14px 0 22px; }
  .page-head h1 { font-size: 24px; letter-spacing: 1px; }
  .page-head p { color: #667; font-size: 14px; margin-top: 6px; }
  .hint { color: #889; font-size: 12.5px; }

  .maker-grid { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .maker-grid { grid-template-columns: 1fr; } }
  .panel { background: #fff; border-radius: 14px; padding: 18px 18px 20px; box-shadow: 0 1px 4px rgba(20,30,50,.06); margin-bottom: 16px; }
  .panel h2 { font-size: 15px; color: #334; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .panel h2 .no { width: 22px; height: 22px; border-radius: 50%; background: #2563eb; color: #fff; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; flex: none; }

  /* 模板选择网格 */
  .tpl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 520px) { .tpl-grid { grid-template-columns: repeat(2, 1fr); } }
  .tpl-opt { border: 2px solid transparent; border-radius: 12px; background: #f4f6f9; padding: 12px 6px 10px; text-align: center; cursor: pointer; transition: border .15s; }
  .tpl-opt:hover { background: #eef2f8; }
  .tpl-opt.on { border-color: #2563eb; background: #eef4ff; }
  .tpl-opt .ti { font-size: 26px; line-height: 1.15; }
  .tpl-opt .tn { font-size: 13.5px; font-weight: 600; margin-top: 3px; }
  .tpl-opt .td { font-size: 11.5px; color: #8892a0; margin-top: 1px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #556; margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; border: 1px solid #d5dbe3; border-radius: 9px; padding: 9px 11px; font-size: 14.5px; outline: none; transition: border .15s; font-family: inherit; }
  .field input:focus, .field textarea:focus { border-color: #2563eb; }
  .field textarea { resize: vertical; }
  .field .counter { float: right; color: #9aa5b1; font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
  .link-row { display: grid; grid-template-columns: 96px 1fr; gap: 8px; margin-bottom: 8px; }
  .link-row input { border: 1px solid #d5dbe3; border-radius: 9px; padding: 8px 10px; font-size: 14px; outline: none; }
  .link-row input:focus { border-color: #2563eb; }

  .themes { display: flex; gap: 10px; flex-wrap: wrap; }
  .theme-opt { flex: 1; min-width: 86px; border: 2px solid transparent; border-radius: 12px; padding: 8px 6px; text-align: center; font-size: 12.5px; cursor: pointer; background: #f4f6f9; transition: border .15s; }
  .theme-opt .swatch { height: 34px; border-radius: 8px; margin-bottom: 6px; border: 1px solid rgba(0,0,0,.08); }
  .theme-opt.on { border-color: #2563eb; }

  .go-btn { width: 100%; border: none; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; font-size: 16.5px; padding: 13px; letter-spacing: 2px; box-shadow: 0 3px 10px rgba(37,99,235,.3); }
  .go-btn:active { transform: translateY(1px); }
  .result { display: none; margin-top: 14px; }
  .result .url-box { display: flex; gap: 8px; }
  .result .url-box input { flex: 1; border: 1px solid #cfd8e3; border-radius: 9px; padding: 9px 10px; font-size: 13px; background: #f8fafc; color: #345; }
  .copy-btn { border: none; border-radius: 9px; background: #2563eb; color: #fff; padding: 0 16px; font-size: 14px; flex: none; }
  .meter { height: 8px; border-radius: 4px; background: #e5eaf0; margin: 10px 0 4px; overflow: hidden; }
  .meter .fill { height: 100%; width: 0%; background: #22c55e; border-radius: 4px; transition: width .2s; }
  .meter-text { font-size: 12.5px; color: #778; }
  .qr-area { text-align: center; margin-top: 10px; }
  .qr-area svg { background: #fff; padding: 8px; border-radius: 10px; border: 1px solid #e3e8ef; }
  .qr-area p { font-size: 12.5px; color: #778; margin-top: 6px; }

  .phone { width: 100%; max-width: 330px; margin: 0 auto; background: #10151c; border-radius: 40px; padding: 10px; box-shadow: 0 24px 52px rgba(15,25,50,.32), inset 0 0 0 2px #2b3542; }
  .p-island { width: 78px; height: 20px; background: #10151c; border-radius: 999px; margin: 10px auto -12px; position: relative; z-index: 2; box-shadow: inset 0 0 0 1px #242e3a; }
  .p-status { display: flex; justify-content: space-between; align-items: center; padding: 8px 18px 4px; font-size: 10.5px; font-weight: 600; color: #6b7684; letter-spacing: .5px; }
  .p-home { width: 88px; height: 4px; border-radius: 2px; background: #39434f; margin: 8px auto 3px; }
  .phone .screen { border-radius: 26px; overflow: hidden; min-height: 500px; background: #f2f4f8; display: flex; flex-direction: column; align-items: stretch; }
  .phone .screen .nfc-card { flex: 1; }
  .preview-note { text-align: center; font-size: 12.5px; color: #889; margin-top: 10px; }
  .sticky { position: sticky; top: 16px; }

  /* ---------- 卡片（预览与展示共用）：风格引擎在此基础上叠加 ---------- */
  .nfc-card { --row-bg: rgba(0,0,0,.035); --row-bd: rgba(20,40,80,.12); --ac-fg: #fff;
    position: relative; overflow: hidden; isolation: isolate;
    width: 100%; padding: 28px 20px 20px; display: flex; flex-direction: column; align-items: center; text-align: center;
    font-family: var(--font-d, inherit); background: var(--bg); color: var(--fg); }
  .nfc-card .avatar { width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 600; margin-bottom: 12px; background: var(--av-bg); color: var(--av-fg); }
  .nfc-card .name { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .nfc-card .tag { font-size: 13px; margin-top: 3px; opacity: .85; }
  .nfc-card .bio { font-size: 13.5px; margin-top: 10px; opacity: .92; max-width: 268px; white-space: pre-wrap; }
  .nfc-card .quote { font-size: 14.5px; margin: 14px 0 2px; max-width: 270px; white-space: pre-wrap; line-height: 1.9; }
  .nfc-card .sig { font-size: 13px; margin-top: 10px; opacity: .8; }
  .nfc-card .price-line { font-size: 30px; font-weight: 800; margin-top: 8px; letter-spacing: 1px; }
  .nfc-card .price-line .cur { font-size: 16px; font-weight: 600; margin-right: 2px; }
  .nfc-card .badge { display: inline-block; font-size: 12px; border-radius: 999px; padding: 2px 12px; margin-top: 6px; background: var(--row-bg); border: 1px solid var(--row-bd); }
  .nfc-card .sep { width: 44px; height: 3px; border-radius: 2px; margin: 16px 0 6px; background: var(--row-bd); }
  .nfc-card .rows { width: 100%; max-width: 270px; margin-top: 6px; }
  .nfc-card .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; margin-top: 8px; font-size: 14px; cursor: pointer; background: var(--row-bg); border: 1px solid var(--row-bd); }
  .nfc-card .row .ico { flex: none; width: 20px; text-align: center; }
  .nfc-card .row .val { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nfc-card .row .act { flex: none; font-size: 12px; border-radius: 6px; padding: 2px 8px; color: var(--ac); background: rgba(127,127,127,.001); }
  .nfc-card .links { width: 100%; max-width: 270px; margin-top: 8px; }
  .nfc-card .link-btn { display: block; margin-top: 8px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; background: var(--ac); color: var(--ac-fg); }
  .nfc-card .brand { margin-top: auto; padding-top: 20px; font-size: 11px; opacity: .55; width: 100%; }
  .nfc-card .brand a { text-decoration: underline; }
  .nfc-card .heart { font-size: 40px; margin: 4px 0 8px; animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.16); } 24% { transform: scale(1); } 36% { transform: scale(1.1); } }

  .t-white  { --bg:#f6f8fb; --fg:#24303f; --ac:#2563eb; --av-bg:#e3ecff; --av-fg:#2563eb; --row-bd:rgba(30,60,120,.14); }
  .t-night  { --bg:linear-gradient(160deg,#12161d,#1c2530); --fg:#e8edf4; --ac:#8fc0ff; --ac-fg:#0d2137; --av-bg:#233042; --av-fg:#8fc0ff; --row-bg:rgba(255,255,255,.06); --row-bd:rgba(255,255,255,.16); }
  .t-blue   { --bg:linear-gradient(160deg,#0b3a75,#0a2a52 70%); --fg:#eaf2fc; --ac:#ffffff; --ac-fg:#0b3a75; --av-bg:rgba(255,255,255,.14); --av-fg:#fff; --row-bg:rgba(255,255,255,.10); --row-bd:rgba(255,255,255,.2); }
  .t-pink   { --bg:linear-gradient(160deg,#ffe9ef,#ffd9e4); --fg:#7a2b47; --ac:#e0508a; --av-bg:#ffd3e2; --av-fg:#c2336e; --row-bg:rgba(255,255,255,.5); --row-bd:rgba(194,51,110,.22); }
  .t-star   { --bg:linear-gradient(160deg,#1a1440,#0d0a24); --fg:#ece8ff; --ac:#c4b5fd; --ac-fg:#241b4d; --av-bg:#2c2352; --av-fg:#c4b5fd; --row-bg:rgba(255,255,255,.07); --row-bd:rgba(196,181,253,.25); }
  .t-cream  { --bg:#fbf5ea; --fg:#5b4a36; --ac:#b9863e; --av-bg:#f3e6cd; --av-fg:#96702c; --row-bg:rgba(255,255,255,.6); --row-bd:rgba(150,112,44,.25); }
  .t-ink    { --bg:linear-gradient(160deg,#f7f2e7,#ece2cc); --fg:#3a3226; --ac:#8a6f3c; --av-bg:#e6d9ba; --av-fg:#6d5626; --row-bg:rgba(255,255,255,.55); --row-bd:rgba(109,86,38,.28); }
  .t-green  { --bg:linear-gradient(160deg,#0f3d2e,#0a2c21); --fg:#e4f2ea; --ac:#7fd6a4; --ac-fg:#0a2c21; --av-bg:#1c5442; --av-fg:#a8e6c4; --row-bg:rgba(255,255,255,.07); --row-bd:rgba(127,214,164,.28); }
  .t-orange { --bg:linear-gradient(160deg,#fff3e8,#ffe4cd); --fg:#6b3a12; --ac:#e96f22; --av-bg:#ffd9b8; --av-fg:#c65a14; --row-bg:rgba(255,255,255,.55); --row-bd:rgba(198,90,20,.24); }
  .t-lemon  { --bg:#fdfbe4; --fg:#5c5413; --ac:#a89b16; --av-bg:#f3ecae; --av-fg:#7d721b; --row-bg:rgba(255,255,255,.6); --row-bd:rgba(125,114,27,.28); }
  .t-purple { --bg:linear-gradient(160deg,#241b3d,#150f2a); --fg:#ece7fb; --ac:#a78bfa; --ac-fg:#1e1440; --av-bg:#372a5c; --av-fg:#c4b5fd; --row-bg:rgba(255,255,255,.07); --row-bd:rgba(167,139,250,.3); }

  /* ---------- 艺术风格引擎（8 个，用途×风格父子结构） ----------
     方法论来源：anthropics/frontend-design skill（signature element + 从题材找视觉语言）
     + 2026 趋势（液态玻璃/light skeuomorphism/复古重组） */
  .s-flat { --bg:#f7f8fa; --fg:#1f2733; --ac:#2563eb; --av-bg:#e8effc; --av-fg:#2563eb; --row-bg:#ffffff; --row-bd:#e6eaf0; }
  .s-flat .row { box-shadow:0 1px 3px rgba(20,30,50,.06); }
  .s-flat .sep { width:28px; }

  .s-editorial { --bg:#f3efe6; --fg:#241f16; --ac:#8a3324; --av-bg:transparent; --av-fg:#241f16; --row-bg:transparent; --row-bd:rgba(36,31,22,.3); font-family:Georgia,"Times New Roman","Songti SC",SimSun,serif; }
  .s-editorial::before { content:""; position:absolute; z-index:-1; top:16px; left:22px; right:22px; height:6px; border-top:2px solid #241f16; border-bottom:1px solid #241f16; }
  .s-editorial::after { content:"NO.01"; position:absolute; z-index:-1; top:30px; right:26px; font-size:10px; letter-spacing:.28em; color:rgba(36,31,22,.5); }
  .s-editorial .tag { letter-spacing:.22em; font-size:11px; }
  .s-editorial .name { font-size:26px; font-weight:600; }
  .s-editorial .bio { font-style:italic; }
  .s-editorial .row { border-radius:0; border-width:0 0 1px 0; box-shadow:none; }
  .s-editorial .row .act { border:1px solid rgba(36,31,22,.4); border-radius:2px; }
  .s-editorial .link-btn { border-radius:0; font-weight:400; }
  .s-editorial .sep { width:0; height:0; margin:8px 0 2px; }

  .s-pixel { --bg:#0e1216; --fg:#c8f7c5; --ac:#ffd93d; --ac-fg:#10160f; --av-bg:#1b232c; --av-fg:#7cf77c; --row-bg:#141b22; --row-bd:#31463a; font-family:"Courier New",ui-monospace,Consolas,monospace; }
  .s-pixel::after { content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(200,247,197,.05) 0 1px, transparent 1px 3px); }
  .s-pixel .name { letter-spacing:3px; text-shadow:0 0 10px rgba(124,247,124,.45); }
  .s-pixel .tag, .s-pixel .bio { font-size:12.5px; }
  .s-pixel .avatar { border-radius:0; box-shadow:0 0 0 2px #31463a, 0 0 0 4px #0e1216, 0 0 0 5px #31463a; }
  .s-pixel .row { border-radius:0; box-shadow:inset 0 0 0 1.5px var(--row-bd); }
  .s-pixel .link-btn { border-radius:0; box-shadow:0 0 0 1.5px var(--ac); }
  .s-pixel .sep { background:repeating-linear-gradient(90deg, var(--ac) 0 5px, transparent 5px 10px); height:4px; }

  .s-glass { --bg:linear-gradient(140deg,#372a68,#7a4fb3 48%,#2f6fc2); --fg:#f5f3ff; --ac:#ffffff; --ac-fg:#372a68; --av-bg:rgba(255,255,255,.28); --av-fg:#ffffff; --row-bg:rgba(255,255,255,.13); --row-bd:rgba(255,255,255,.38); }
  .s-glass::before { content:""; position:absolute; z-index:-1; top:-50px; right:-50px; width:190px; height:190px; border-radius:50%; background:radial-gradient(circle,#ff8ad4 0%,transparent 68%); filter:blur(26px); }
  .s-glass::after { content:""; position:absolute; z-index:-1; bottom:-60px; left:-50px; width:210px; height:210px; border-radius:50%; background:radial-gradient(circle,#5ad1ff 0%,transparent 68%); filter:blur(26px); }
  .s-glass .row { backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); }
  .s-glass .link-btn { box-shadow:0 4px 18px rgba(255,255,255,.22); }
  .s-glass .avatar { box-shadow:inset 0 0 0 1px rgba(255,255,255,.5); }

  .s-ink { --bg:#f6f2e8; --fg:#2c261d; --ac:#a63226; --av-bg:#e9e2d0; --av-fg:#2c261d; --row-bg:rgba(44,38,29,.045); --row-bd:rgba(44,38,29,.22); font-family:"Kaiti SC",KaiTi,STKaiti,"Songti SC",serif; }
  .s-ink::before { content:""; position:absolute; z-index:-1; inset:0; background:radial-gradient(ellipse at 18% 8%, rgba(44,38,29,.07), transparent 38%), radial-gradient(ellipse at 88% 85%, rgba(44,38,29,.06), transparent 34%); }
  .s-ink::after { content:"印"; position:absolute; top:16px; right:18px; width:32px; height:32px; line-height:32px; text-align:center; font-size:15px; color:#f6f2e8; background:#a63226; border-radius:4px; opacity:.88; }
  .s-ink .name { font-size:25px; letter-spacing:2px; }
  .s-ink .row { border-radius:3px; }
  .s-ink .link-btn { border-radius:3px; }
  .s-ink .sep { width:34px; height:2px; }

  .s-doodle { --bg:#fdf8ee; --fg:#3d3229; --ac:#e8734a; --ac-fg:#ffffff; --av-bg:#f7e4cf; --av-fg:#c05b3a; --row-bg:#ffffff; --row-bd:#3d3229; font-family:"Kaiti SC",KaiTi,STKaiti,"Yuanti SC","Microsoft YaHei",sans-serif; }
  .s-doodle::before { content:"✎ ~"; position:absolute; top:12px; right:18px; font-size:15px; color:rgba(61,50,41,.45); }
  .s-doodle .avatar { border:2px solid #3d3229; border-radius:46% 54% 55% 45%/52% 44% 56% 48%; }
  .s-doodle .name { font-size:23px; }
  .s-doodle .row { border:1.5px solid #3d3229; border-radius:11px 15px 9px 14px; box-shadow:2px 3px 0 rgba(61,50,41,.18); }
  .s-doodle .rows .row:nth-child(odd) { transform:rotate(-.7deg); }
  .s-doodle .rows .row:nth-child(even) { transform:rotate(.6deg); }
  .s-doodle .link-btn { border:1.5px solid #3d3229; border-radius:13px 9px 14px 10px; box-shadow:2px 3px 0 rgba(61,50,41,.22); }
  .s-doodle .sep { background:repeating-linear-gradient(90deg,#3d3229 0 8px,transparent 8px 14px); height:2px; width:70px; }

  .s-pop { --bg:#ffd93d; --fg:#161616; --ac:#161616; --ac-fg:#ffd93d; --av-bg:#ff5d73; --av-fg:#ffffff; --row-bg:#ffffff; --row-bd:#161616; }
  .s-pop::before { content:""; position:absolute; z-index:-1; inset:0; background-image:radial-gradient(rgba(22,22,22,.16) 1.5px, transparent 1.6px); background-size:13px 13px; }
  .s-pop .avatar { border:2.5px solid #161616; box-shadow:3px 3px 0 #161616; }
  .s-pop .name { font-weight:900; letter-spacing:1px; }
  .s-pop .row { border:2px solid #161616; border-radius:10px; box-shadow:3px 3px 0 #161616; }
  .s-pop .row .act { border:1.5px solid #161616; border-radius:6px; }
  .s-pop .link-btn { border:2px solid #161616; border-radius:10px; box-shadow:3px 3px 0 #161616; }
  .s-pop .sep { background:#161616; width:54px; height:3px; }

  .s-y2k { --bg:linear-gradient(150deg,#0f0c29,#302b63 55%,#1d1b3a); --fg:#eaf6ff; --ac:#00f0ff; --ac-fg:#001318; --av-bg:linear-gradient(135deg,#00f0ff,#ff3ddc); --av-fg:#001318; --row-bg:rgba(0,240,255,.06); --row-bd:rgba(0,240,255,.4); }
  .s-y2k::before { content:"✦"; position:absolute; top:14px; left:18px; color:#ff3ddc; font-size:13px; }
  .s-y2k::after { content:"✦"; position:absolute; bottom:52px; right:22px; color:#00f0ff; font-size:17px; opacity:.85; }
  .s-y2k .name { text-shadow:0 0 14px rgba(0,240,255,.8), 0 0 34px rgba(255,61,220,.45); letter-spacing:1.5px; }
  .s-y2k .link-btn { background:linear-gradient(90deg,#00f0ff,#ff3ddc); color:#001318; box-shadow:0 0 18px rgba(0,240,255,.35); }
  .s-y2k .avatar { box-shadow:0 0 14px rgba(255,61,220,.5); }

  /* ---------- 动效层：用途专属 flair（v3，每风格一个 signature 动效） ---------- */
  @keyframes fx-rise { 0%{transform:translateY(0);opacity:0} 12%{opacity:.9} 100%{transform:translateY(-240px);opacity:0} }
  @keyframes fx-fall { 0%{transform:translateY(-30px) rotate(-8deg);opacity:0} 12%{opacity:.85} 100%{transform:translateY(300px) rotate(28deg);opacity:0} }
  @keyframes fx-beat { 0%,100%{transform:scale(1)} 14%{transform:scale(1.13)} 28%{transform:scale(1)} 42%{transform:scale(1.09)} 56%{transform:scale(1)} }
  @keyframes fx-twinkle { 0%,100%{opacity:.15} 50%{opacity:1} }
  @keyframes fx-drift { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(26px,-18px) scale(1.12)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes fx-shimmer { 0%{transform:translateX(-130%) skewX(-18deg)} 100%{transform:translateX(280%) skewX(-18deg)} }
  @keyframes fx-stamp { 0%{transform:scale(2.4) rotate(-16deg);opacity:0} 55%{transform:scale(.9) rotate(-7deg);opacity:1} 100%{transform:scale(1) rotate(-8deg);opacity:.9} }
  @keyframes fx-flicker { 0%,6.5%,8.5%,100%{opacity:1} 7.5%{opacity:.35} 31%,33.5%{opacity:1} 32%{opacity:.45} 68%,70.5%{opacity:1} 69%{opacity:.3} }
  @keyframes fx-blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  @keyframes fx-eqmarch { 0%{background-position-x:0} 100%{background-position-x:56px} }
  @keyframes fx-swing { 0%,100%{transform:rotate(9deg)} 50%{transform:rotate(-9deg)} }
  @keyframes fx-hue { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
  @keyframes fx-starfall { 0%{background-position:0 0, 0 0} 100%{background-position:-30px 340px, -80px 600px} }
  @keyframes fx-glowc { 0%,100%{box-shadow:0 0 10px rgba(0,240,255,.3)} 50%{box-shadow:0 0 26px rgba(255,61,220,.55)} }

    else if ((d.k === 'card' || !d.k) && d.q && /^[0-9]{5,12}$/.test(d.q)) url = 'https://q1.qlogo.cn/g?b=qq&nk=' + d.q + '&s=640';

      return st[i] ? st[i].id : 'flat';
    }
    function rebuildForm() {
      var t = TPL[curTpl()];
      formBox.innerHTML = '';
      themes.innerHTML = '';
      var halves = [];
      function flushHalves() {
        if (halves.length) {
          var g = el('div', 'grid2');
          halves.forEach(function (f) { g.appendChild(f); });
          formBox.appendChild(g);
          halves = [];
        }
      }
      t.fd.forEach(function (f) {
        if (f.type === 'rows') {
          flushHalves();
          var wrapF = el('div', 'field');
          var lb = el('label'); lb.textContent = f.lb; wrapF.appendChild(lb);
          for (var i = 0; i < f.max; i++) {
            var lr = el('div', 'link-row');
            var ia = el('input'); ia.dataset.rows = f.id + ':n:' + i; ia.placeholder = f.nph;
            var iu = el('input'); iu.dataset.rows = f.id + ':v:' + i; iu.placeholder = f.vph;
            lr.appendChild(ia); lr.appendChild(iu);
            wrapF.appendChild(lr);
          }
          if (f.tip) wrapF.appendChild(el('p', 'hint', f.tip));
          formBox.appendChild(wrapF);
        } else {
          var fe = mkField(f);
          if (f.half) halves.push(fe);
          else { flushHalves(); formBox.appendChild(fe); }
        }
      });
      flushHalves();
      t.st.forEach(function (s, i) {
        var o = el('div', 'theme-opt' + (i === 0 ? ' on' : ''));
        o.dataset.idx = i;
        o.title = s.desc;
        var sw = el('div', 'swatch'); sw.style.background = s.sw;
        o.appendChild(sw);
        o.appendChild(el('div', null, s.name));
        var dv = el('div'); dv.textContent = s.desc;
        dv.style.cssText = 'font-size:10.5px;color:#8892a0;line-height:1.3;margin-top:1px;';
        o.appendChild(dv);
        o.onclick = function () {
          document.querySelectorAll('.theme-opt').forEach(function (x) { x.classList.remove('on'); });
          o.classList.add('on'); refreshPreview();
        };
        themes.appendChild(o);
      });
      bindInputs();
      $('result').style.display = 'none';
    }
    function mkField(f) {
      var w = el('div', 'field');
      var lb = el('label'); lb.textContent = f.lb + (f.req || /选填/.test(f.lb) ? '' : '（选填）');
      if (f.max) { var ct = el('span', 'counter'); ct.textContent = '0/' + f.max; lb.appendChild(ct); }
      w.appendChild(lb);
      var inp;
      if (f.type === 'area') {
        inp = document.createElement('textarea');
        inp.rows = 2;
      } else {
        inp = el('input');
        inp.type = f.type === 'tel' ? 'tel' : f.type === 'email' ? 'email' : 'text';
      }
      inp.dataset.fid = f.id;
      if (f.max) {
        inp.maxLength = f.max;
        inp.addEventListener('input', function () { ct.textContent = inp.value.length + '/' + f.max; });
      }
      if (f.ph) inp.placeholder = f.ph;
      w.appendChild(inp);
      if (f.tip) w.appendChild(el('p', 'hint', f.tip));
      return w;
    }
    function bindInputs() {
      document.querySelectorAll('#form-box input, #form-box textarea').forEach(function (inp) {
        inp.addEventListener('input', refreshPreview);
      });
    }
    function secTitle(no, txt) {
      var h = el('h2');
      var n = el('span', 'no', String(no));
      h.appendChild(n); h.appendChild(document.createTextNode(txt));
      return h;
    }
    function $(id) { return document.getElementById(id); }
    function collect() {
      var k = curTpl(), t = TPL[k];
      var d = { v: 2, k: k, sty: curStyle() };
      var missing = null;
      t.fd.forEach(function (f) {
        if (f.type === 'rows') {
          var arr = [];
          for (var i = 0; i < f.max; i++) {
            var a = document.querySelector('[data-rows="' + f.id + ':n:' + i + '"]').value.trim();
            var v = document.querySelector('[data-rows="' + f.id + ':v:' + i + '"]').value.trim();
            if (f.url) v = cleanUrl(v);
            if (a && v) arr.push([a, v]);
          }
          if (arr.length) d[f.id] = arr;
          if (f.req && !arr.length && !missing) missing = f.lb;
        } else {
          var inp = document.querySelector('[data-fid="' + f.id + '"]');
          var val = inp.value.trim();
          if (val) d[f.id] = val;
          if (f.req && !val && !missing) missing = f.lb;
        }
      });
      return { d: d, missing: missing };
    }
    function refreshPreview() {
      var sc = $('preview-screen');
      sc.innerHTML = '';
      var r = collect();
      sc.appendChild(renderCard(r.d));
    }
    go.onclick = function () {
      var agreeBox = document.getElementById('agree-tos');
      if (!agreeBox.checked) { toast('请先勾选同意《免责声明与用户权益承诺书》'); agreeBox.focus(); return; }
      localStorage.setItem('nfc-tos', 'v2');
      var r = collect();
      if (r.missing) { toast('还有必填项：' + r.missing); return; }
      var url = baseHref() + '#d=' + b64urlEncode(JSON.stringify(r.d));
      var len = url.length;
      $('gen-url').value = url;
      $('result').style.display = 'block';
      var pct = Math.min(100, Math.round(len / NFC_LIMIT * 100));
      $('meter-fill').style.width = pct + '%';
      $('meter-fill').style.background = len > NFC_LIMIT ? '#ef4444' : (len > NFC_WARN ? '#f59e0b' : '#22c55e');
      $('meter-text').textContent = '链接长度 ' + len + ' / ' + NFC_LIMIT + (len > NFC_LIMIT ? ' —— 超出卡的容量！请精简内容' : '（卡的 NFC 容量上限，越短越稳）');
      if (len > NFC_LIMIT) toast('链接太长，卡的 NFC 装不下，请精简');
      var qa = $('qr-area');
      qa.innerHTML = '';
      try {
        var qr = qrcode(0, 'M');
        qr.addData(url); qr.make();
        qa.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
        qa.appendChild(el('p', null, '在电脑上填的？扫这个码把链接带上手机'));
      } catch (e) {
        qa.appendChild(el('p', null, '二维码生成失败，不影响使用，直接复制链接即可'));
      }
      $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    $('copy-btn').onclick = function () {
      var u = $('gen-url').value;
      if (u) copyText(u, '链接已复制，去 NFC Tools 写入吧');
    };

    rebuildForm();
    refreshPreview();
  }

  /* ================= 入口 ================= */
  function boot() {
    var m = location.hash.match(/^#d=([A-Za-z0-9\-_]+)$/);

      if (k === 'card' && typeof d.n !== 'string') throw 0;
      if (k !== 'card' && d.v !== 2) throw 0;
      runDisplay(d);
    } catch (e) { runBroken(); }
  }
  boot();
})();
